<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Menu">
<title>Menu de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F2;
    --card:#FFFFFF;
    --ink:#2A2119;
    --ink-soft:#7A6F63;
    --board:#221419;
    --board-2:#341F26;
    --chalk:#F3E9DD;
    --gold-1:#F0CD82;
    --gold-2:#C9992E;
    --gold-3:#8C6A1B;
    --mustard:#C9992E;
    --mustard-deep:#A87F26;
    --rust:#A8432A;
    --sage:#6E9178;
    --berry:#B04E68;
    --cheat-a:#FFB65C;
    --cheat-b:#E24B3E;
    --line: rgba(42,33,25,0.13);
    --shadow: 0 4px 18px rgba(34,20,25,0.09);
    --shadow-gold: 0 6px 20px rgba(140,106,27,0.28);
  }
  *{box-sizing:border-box;}
  body,#app-root{margin:0;padding:0;}
  #app-root{
    font-family:'DM Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    position:relative;
    -webkit-tap-highlight-color: transparent;
  }
  .display{font-family:'Fraunces', serif;}
  #app{flex:1; padding-bottom:84px;}
  ::-webkit-scrollbar{display:none;}

  /* ---- Header premium ---- */
  .board-header{
    background:linear-gradient(165deg, var(--board) 0%, var(--board-2) 100%);
    color:var(--chalk);
    padding:24px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  .board-header::before{
    content:"";
    position:absolute; top:-60%; right:-30%;
    width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, rgba(240,205,130,0.20) 0%, rgba(240,205,130,0) 70%);
    pointer-events:none;
  }
  .board-header::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
  }
  .board-eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold-1);
    margin:0 0 4px;
    position:relative;
  }
  .board-title{
    font-size:27px;
    font-weight:600;
    margin:0;
    line-height:1.15;
    position:relative;
  }
  .board-sub{
    font-size:13px;
    color:rgba(243,233,221,0.6);
    margin-top:6px;
    font-style:italic;
    font-family:'Fraunces', serif;
    position:relative;
  }
  .stat-chips{
    display:flex; gap:8px; margin-top:14px; position:relative; flex-wrap:wrap;
  }
  .stat-chip{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--chalk);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(240,205,130,0.25);
    border-radius:20px;
    padding:5px 11px;
    display:flex; align-items:center; gap:5px;
  }
  .stat-chip b{color:var(--gold-1); font-weight:700;}
  .plain-header{
    padding:24px 20px 14px;

  }
  .plain-header .board-eyebrow{color:var(--rust);}
  .plain-header .board-title{color:var(--ink);}
  .plain-header .board-sub{color:var(--ink-soft); font-style:normal; font-family:'DM Sans',sans-serif;}

  /* ---- Week view (grille compacte) ---- */
  .week-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:16px 16px 20px;
  }
  .week-cell{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:10px 11px 11px;
    display:flex;
    flex-direction:column;
    gap:7px;
    min-height:132px;
    position:relative;
    transition:background 0.25s, border-color 0.25s;
  }
  .week-cell.is-weekend{grid-column: 1 / -1;}
  .week-cell.is-weekend .week-slots{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px;}
  .week-cell.is-weekend .week-slot-mini:nth-child(2),
  .week-cell.is-weekend .week-slot-mini:nth-child(3){border-top:none; padding-top:0; margin-top:0;}
  .week-cell.is-cheat{
    background:linear-gradient(150deg, var(--cheat-a), var(--cheat-b));
    border-color:transparent;
    box-shadow:0 6px 18px rgba(226,75,62,0.28);
  }
  .week-cell-top{display:flex; align-items:center; justify-content:space-between;}
  .week-cell-day{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .week-cell.is-cheat .week-cell-day{color:#fff;}
  .cheat-toggle{
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; background:rgba(42,33,25,0.06);
    border:none; cursor:pointer; flex-shrink:0;
    transition:transform 0.15s;
  }
  .cheat-toggle:active{transform:scale(0.85);}
  .week-cell.is-cheat .cheat-toggle{background:rgba(255,255,255,0.28);}
  .cheat-label{
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.06em; text-transform:uppercase;
    color:#fff; background:rgba(0,0,0,0.16); border-radius:20px; padding:2px 8px; width:fit-content;
  }
  .week-slots{display:flex; flex-direction:column; gap:0;}
  .week-slot-mini{
    display:flex;
    flex-direction:column;
    gap:2px;
    border-top:1px dashed var(--line);
    padding-top:7px;
    margin-top:7px;
    cursor:pointer;
  }
  .week-cell.is-cheat .week-slot-mini{border-top-color:rgba(255,255,255,0.3);}
  .week-slot-mini:first-child{border-top:none; padding-top:0; margin-top:0;}
  .week-slot-mini:active{opacity:0.7;}
  .mini-tag{
    font-family:'Space Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
  }
  .week-cell.is-cheat .mini-tag{color:rgba(255,255,255,0.75);}
  .mini-content{
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    display:flex;
    align-items:center;
  }
  .week-cell.is-cheat .mini-content{color:#fff;}
  .mini-content .tag-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    margin-right:5px;flex-shrink:0;
  }
  .mini-content.is-empty{
    color:var(--ink-soft);
    font-weight:400;
    border-bottom:1.5px dashed rgba(114,111,96,0.4);
    padding-bottom:1px;
    width:fit-content;
  }
  .people-dots{display:flex; gap:5px;}
  .p-dot{
    width:19px; height:19px; border-radius:50%;
    border:1.5px solid; display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:9px; font-weight:700; color:inherit;
    flex-shrink:0; background:transparent;
  }
  .p-dot.filled{color:#fff;}
  .week-cell.is-cheat .mini-content.is-empty{color:rgba(255,255,255,0.7); border-bottom-color:rgba(255,255,255,0.45);}
  .remove-x{
    color:var(--rust);
    font-size:16px;
    line-height:1;
    padding:4px 2px;
    flex-shrink:0;
  }

  /* ---- Bottom nav ---- */
  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(255,255,255,0.86);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(240,205,130,0.4);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    padding:6px 4px;
    font-family:'DM Sans',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .nav-btn .nav-icon{font-size:20px; line-height:1; transition:transform 0.15s;}
  .nav-btn.active{color:var(--gold-3); font-weight:700;}
  .nav-btn.active .nav-icon{transform:translateY(-1px);}
  .nav-btn .nav-dot{width:4px; height:4px; border-radius:50%; background:transparent; margin-top:-1px;}
  .nav-btn.active .nav-dot{background:var(--gold-2);}

  /* ---- Buttons ---- */
  .btn{
    font-family:'DM Sans',sans-serif;
    border:none;
    border-radius:11px;
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color:#2A2119;
    box-shadow:var(--shadow-gold);
  }
  .btn-primary:active{background:linear-gradient(135deg, var(--gold-1), var(--gold-3));}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-rust{background:transparent; color:var(--rust); border:1px solid rgba(168,67,42,0.3);}
  .btn-sage{background:var(--sage); color:#fff;}
  .btn-block{width:100%;}
  .fab-row{padding:16px;}

  /* ---- Recipes tab ---- */
  .recipe-card-wrap{
    position:relative;
    margin:0 16px 12px;
    border-radius:14px;
    overflow:hidden;
  }
  .recipe-card-delete-bg{
    position:absolute; inset:0;
    background:var(--rust);
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:22px;
    cursor:pointer;
  }
  .recipe-card-delete-bg span{
    color:#fff; font-weight:700; font-size:12.5px;
    font-family:'DM Sans',sans-serif; display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .recipe-card{
    background:var(--card);
    margin:0;
    border-radius:14px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    border-left:4px solid var(--mustard);
    cursor:pointer;
    position:relative;
    z-index:1;
    touch-action:pan-y;
    transition:transform 0.22s ease;
  }
  .recipe-card .rc-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .recipe-card .rc-name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px;}
  .recipe-card .rc-tag{
    font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.05em; padding:3px 8px; border-radius:20px; color:#fff; flex-shrink:0; margin-left:8px;
  }
  .recipe-card .rc-count{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .empty-state{
    text-align:center;
    padding:50px 30px;
    color:var(--ink-soft);
  }
  .empty-state .es-icon{font-size:34px; margin-bottom:10px;}
  .empty-state .es-title{font-family:'Fraunces',serif; font-size:17px; color:var(--ink); margin-bottom:6px; font-weight:600;}
  .empty-state .es-sub{font-size:13.5px; line-height:1.5;}

  /* ---- Courses tab ---- */
  .section-label{
    font-family:'Space Mono',monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft); padding:16px 20px 8px;
  }
  .course-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card);
    margin:0 16px 8px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    cursor:pointer;
  }
  .checkbox{
    width:21px; height:21px; border-radius:6px;
    border:2px solid var(--sage);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#fff;
  }
  .checkbox.checked{background:var(--sage);}
  .course-text{flex:1; font-size:14.5px;}
  .course-text.checked{text-decoration:line-through; color:var(--ink-soft);}
  .course-qty{font-family:'Space Mono',monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
  .add-item-row{display:flex; gap:8px; padding:4px 16px 6px;}
  .add-item-row input{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    font-family:'DM Sans',sans-serif; font-size:14px; background:var(--card);
  }
  .del-item{color:var(--rust); font-size:15px; padding:2px 4px;}

  /* ---- Forms ---- */
  .field{padding:0 20px 14px;}
  .field label{
    display:block; font-family:'Space Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    font-family:'DM Sans',sans-serif; font-size:14.5px; background:#fff; color:var(--ink);
  }
  .field textarea{min-height:90px; resize:vertical; font-family:'DM Sans',sans-serif;}
  .tag-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .tag-choice{
    padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600;
    border:1.5px solid var(--line); cursor:pointer; color:var(--ink-soft);
  }
  .tag-choice.sel{color:#fff; border-color:transparent;}
  .ing-row{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .ing-row input[type=number]{width:64px; flex-shrink:0;}
  .ing-row select{width:92px; flex-shrink:0; padding:11px 6px; font-size:13px;}
  .ing-row input[type=text]{flex:1;}
  .ing-remove{color:var(--rust); font-size:18px; padding:2px 4px; flex-shrink:0;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(38,51,43,0.45);
    display:flex; align-items:flex-end; z-index:50;
    max-width:520px; margin:0 auto;
  }
  .modal-sheet{
    background:var(--paper);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding-bottom:26px;
    animation: sheet-up 0.22s ease-out;
  }
  @keyframes sheet-up{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 4px;}
  .sheet-title{font-family:'Fraunces',serif; font-weight:600; font-size:18px; padding:10px 20px 4px;}
  .sheet-close{
    position:absolute; top:14px; right:16px; font-size:15px; color:var(--ink-soft);
    background:var(--line); width:28px; height:28px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .pick-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 20px 4px;}
  .pick-cell{
    border:1.5px solid var(--line); border-radius:10px; padding:10px; text-align:center;
    font-size:13px; cursor:pointer; color:var(--ink-soft);
  }
  .pick-cell.filled{border-color:var(--gold-2); color:var(--ink); background:rgba(201,153,46,0.10); font-weight:600;}
  .recipe-pick-row{
    padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .modal-actions{display:flex; gap:10px; padding:16px 20px 4px;}
  .detail-ing{padding:3px 20px; font-size:14px; color:var(--ink);}
  .detail-instr{padding:10px 20px 0; font-size:14px; line-height:1.6; color:var(--ink); white-space:pre-wrap;}
  .loading-wrap{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

  /* ---- Sheet "Qui mange quoi" ---- */
  .all-family-btn{
    margin:10px 20px 6px; padding:12px 14px; border-radius:12px;
    background:linear-gradient(135deg, rgba(240,205,130,0.18), rgba(201,153,46,0.10));
    border:1px dashed var(--gold-2); color:var(--ink); font-family:'DM Sans',sans-serif;
    font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; cursor:pointer; width:calc(100% - 40px);
  }
  .person-row{
    padding:12px 20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:11px; cursor:pointer;
  }
  .person-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:#fff;
  }
  .person-info{flex:1; overflow:hidden;}
  .person-name{font-size:13px; font-weight:700; color:var(--ink); font-family:'DM Sans',sans-serif;}
  .person-recipe{font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .person-recipe.filled{color:var(--ink); font-weight:500;}
  .person-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .person-view{font-size:15px;}
  .person-clear{color:var(--rust); font-size:16px;}
  .who-choice-row{
    padding:14px 20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:12px; cursor:pointer;
  }
</style>

</head>
<body>
<div id="app-root">
  <div id="app"></div>
  <div id="modal-root"></div>
</div>

<script>
(function(){

  var DAYS = [
    {key:'lun', label:'Lundi'}, {key:'mar', label:'Mardi'}, {key:'mer', label:'Mercredi'},
    {key:'jeu', label:'Jeudi'}, {key:'ven', label:'Vendredi'}, {key:'sam', label:'Samedi'}, {key:'dim', label:'Dimanche'}
  ];
  var SLOTS = [{key:'midi', label:'Midi', icon:'☀️'}, {key:'soir', label:'Soir', icon:'🌙'}, {key:'dessert', label:'Dessert', icon:'🍰'}];
  var FAMILY = [
    {key:'selim', label:'Selim', color:'#2F6F6A', initial:'S'},
    {key:'assia', label:'Assia', color:'#B04E68', initial:'A'},
    {key:'lila', label:'Lila', color:'#D9992E', initial:'L'}
  ];
  var UNITS = ['g','kg','ml','l','pièce','c. à s.','c. à c.','pincée','tranche'];
  var TAGS = [
    {key:'rapide', label:'Rapide', color:'#C9992E'},
    {key:'vege', label:'Végé', color:'#6E9178'},
    {key:'confort', label:'Confort', color:'#A8432A'},
    {key:'dessert', label:'Dessert', color:'#B04E68'},
    {key:'leger', label:'Léger', color:'#7A6F63'}
  ];
  var STORAGE_KEY = 'menu-app-data';

  var state = {
    tab: 'semaine',
    recipes: [],
    week: {},
    manualItems: [],
    checked: {},
    modal: null,
    loading: true,
    formDraft: null
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function tagInfo(key){ return TAGS.filter(function(t){return t.key===key;})[0] || TAGS[4]; }
  function familyInfo(key){ return FAMILY.filter(function(f){return f.key===key;})[0]; }

  function emptySlot(){ return {selim:null, assia:null, lila:null}; }
  function emptyWeek(){
    var w = {};
    DAYS.forEach(function(d){ w[d.key] = {midi:emptySlot(), soir:emptySlot(), dessert:emptySlot(), cheat:false}; });
    return w;
  }
  // Migre un ancien format (une seule recette par créneau) vers le format par personne
  function normalizeSlotValue(v){
    if(v && typeof v === 'object') {
      return {selim: v.selim||null, assia: v.assia||null, lila: v.lila||null};
    }
    if(typeof v === 'string'){
      // ancien format : une recette unique -> on la met pour toute la famille
      return {selim: v, assia: v, lila: v};
    }
    return emptySlot();
  }
  function normalizeWeek(w){
    DAYS.forEach(function(d){
      if(!w[d.key]) w[d.key] = {midi:emptySlot(), soir:emptySlot(), dessert:emptySlot(), cheat:false};
      var day = w[d.key];
      day.midi = normalizeSlotValue(day.midi);
      day.soir = normalizeSlotValue(day.soir);
      day.dessert = normalizeSlotValue(day.dessert);
      if(day.cheat===undefined) day.cheat = false;
    });
    return w;
  }
  function assignPerson(day, slot, person, recipeId){
    var s = state.week[day][slot];
    if(person==='all'){
      s.selim = recipeId; s.assia = recipeId; s.lila = recipeId;
    } else {
      s[person] = recipeId;
    }
  }

  function seedRecipes(){
    return [
      {
        id: uid(), name:'Pâtes à la carbonara', tag:'rapide',
        ingredients:[
          {name:'Spaghetti', qty:400, unit:'g'},
          {name:'Lardons', qty:200, unit:'g'},
          {name:'Œufs', qty:3, unit:'pièce'},

  async function loadState(){
    var data = null;
    try{
      if(window.storage && window.storage.get){
        var res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value) data = JSON.parse(res.value);
      }
    }catch(e){ /* pas de donnée via window.storage, on essaie localStorage */ }
    if(!data){
      try{
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if(raw) data = JSON.parse(raw);
      }catch(e){ /* localStorage indisponible */ }
    }
    if(data){
      state.recipes = data.recipes || [];
      state.week = normalizeWeek(data.week || emptyWeek());
      state.manualItems = data.manualItems || [];
      state.checked = data.checked || {};
    } else {
      state.recipes = seedRecipes();
      state.week = emptyWeek();
      state.manualItems = [];
      state.checked = {};
      await persist();
    }
    state.loading = false;
    render();
  }

  async function persist(){
    var payload = JSON.stringify({
      recipes: state.recipes, week: state.week, manualItems: state.manualItems, checked: state.checked
    });
    var savedSomewhere = false;
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(STORAGE_KEY, payload, false);
        savedSomewhere = true;
      }
    }catch(e){ /* environnement sans window.storage (ex: Safari en direct) */ }
    try{
      window.localStorage.setItem(STORAGE_KEY, payload);
      savedSomewhere = true;
    }catch(e){ /* localStorage indisponible */ }
    if(!savedSomewhere){ console.error('Aucune sauvegarde disponible dans cet environnement'); }
  }

  function slotFilledIds(slotVal){
    // liste des recipeId assignés (un par personne présente), sans doublons
    var ids = [];

      var rid = slotVal[f.key];
      if(rid) ids.push(rid);

  function renderSemaine(){
    var filledSlots = 0, total = DAYS.length*SLOTS.length, cheatCount = 0, dessertSlots = 0;
    DAYS.forEach(function(d){
      var day = state.week[d.key];
      if(!day) return;
      SLOTS.forEach(function(s){ if(slotFilledIds(day[s.key]).length>0) filledSlots++; });
      if(slotFilledIds(day.dessert).length>0) dessertSlots++;
      if(day.cheat) cheatCount++;
    });
    var chips = '<div class="stat-chips">' +
      '<span class="stat-chip">🍽 <b>'+filledSlots+'</b>/'+total+'</span>' +
      '<span class="stat-chip">🍰 <b>'+dessertSlots+'</b> dessert'+(dessertSlots>1?'s':'')+'</span>' +
      '<span class="stat-chip">🔥 <b>'+cheatCount+'</b> cheat day'+(cheatCount>1?'s':'')+'</span>' +
      '</div>';
    var html = boardHeader('Cette semaine', 'Menu de la semaine', 'Selim · Assia · Lila — à chacun son assiette.', chips);
    html += '<div class="week-grid">';
    DAYS.forEach(function(d, idx){
      var isWeekend = idx===6; // dimanche seul sur la dernière ligne -> pleine largeur
      var day = state.week[d.key] || {midi:emptySlot(), soir:emptySlot(), dessert:emptySlot(), cheat:false};
      var isCheat = !!day.cheat;
      html += '<div class="week-cell'+(isWeekend?' is-weekend':'')+(isCheat?' is-cheat':'')+'">';
      html += '<div class="week-cell-top"><span class="week-cell-day">'+esc(d.label)+'</span>' +
        '<button class="cheat-toggle" data-action="toggle-cheat" data-day="'+d.key+'" title="Cheat meal">'+(isCheat?'🔥':'🕯️')+'</button></div>';
      if(isCheat) html += '<span class="cheat-label">Cheat day</span>';
      html += '<div class="week-slots">';
      SLOTS.forEach(function(s){
        var slotVal = day[s.key];
        var ids = slotFilledIds(slotVal);
        html += '<div class="week-slot-mini" data-day="'+d.key+'" data-slot="'+s.key+'" data-action="open-slot-people">';
        html += '<span class="mini-tag">'+s.icon+' '+esc(s.label)+'</span>';
        if(ids.length===0){
          html += '<span class="mini-content is-empty">+ ajouter</span>';
        } else {
          html += '<span class="people-dots">';
          FAMILY.forEach(function(f){
            var rid = slotVal[f.key];

            html += '<span class="p-dot'+(filled?' filled':'')+'" style="'+(filled?('background:'+f.color+';border-color:'+f.color+';'):('border-color:'+(isCheat?'rgba(255,255,255,0.4)':'rgba(122,111,99,0.3)')+';'))+'">'+(filled?f.initial:'')+'</span>';
          });

            if(recipe) html += '<span class="mini-content" style="margin-top:2px;">'+esc(recipe.name)+'</span>';
          }
        }
        html += '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- COURSES ----------
  function aggregateAuto(){
    var map = {};
    DAYS.forEach(function(d){
      SLOTS.forEach(function(s){
        var slotVal = state.week[d.key] ? state.week[d.key][s.key] : null;
        if(!slotVal) return;
        // recettes distinctes assignées sur ce créneau (un même plat n'est compté qu'une fois)
        var distinctIds = [];
        FAMILY.forEach(function(f){
          var rid = slotVal[f.key];
          if(rid && distinctIds.indexOf(rid)===-1) distinctIds.push(rid);
        });
        distinctIds.forEach(function(rid){
          var recipe = state.recipes.filter(function(r){return r.id===rid;})[0];
          if(!recipe) return;
          recipe.ingredients.forEach(function(ing){
            if(!ing.name) return;
            var key = ing.name.trim().toLowerCase()+'|'+(ing.unit||'');
            if(!map[key]) map[key] = {key:key, name:ing.name.trim(), unit:ing.unit||'', qty:0};
            map[key].qty += Number(ing.qty)||0;
          });
        });
      });
    });
    return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  }

  function syncDraftFromInputs(){
    var d = state.formDraft;
    var nameEl = document.getElementById('f-name');
    var instrEl = document.getElementById('f-instr');
    if(nameEl) d.name = nameEl.value;
    if(instrEl) d.instructions = instrEl.value;
    document.querySelectorAll('[data-ing-field]').forEach(function(el){
      var idx = Number(el.getAttribute('data-ing-idx'));
      var field = el.getAttribute('data-ing-field');
      if(d.ingredients[idx]) d.ingredients[idx][field] = el.value;
    });
  }

  // ---------- EVENTS ----------
  function attachEvents(){
    document.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', handleAction);
    });
    var addBtn = document.getElementById('manual-item-input');
    if(addBtn){
      addBtn.addEventListener('keydown', function(e){
        if(e.key==='Enter'){ addManualItem(); }
      });
    }
    attachSwipeHandlers();
  }

  var SWIPE_OPEN_X = -84;
  function closeAllSwipedCards(except){
    document.querySelectorAll('.recipe-card[data-swipe-open="1"]').forEach(function(c){
      if(c===except) return;
      c.style.transform = 'translateX(0px)';
      c.dataset.swipeOpen = '0';
    });
  }
  function attachSwipeHandlers(){
    document.querySelectorAll('.recipe-card').forEach(function(card){
      var startX = 0, baseX = 0, curX = 0, dragging = false, moved = false;
      card.addEventListener('touchstart', function(ev){
        closeAllSwipedCards(card);
        startX = ev.touches[0].clientX;
        baseX = card.dataset.swipeOpen==='1' ? SWIPE_OPEN_X : 0;
        dragging = true; moved = false;
        card.style.transition = 'none';
      }, {passive:true});
      card.addEventListener('touchmove', function(ev){
        if(!dragging) return;
        var delta = ev.touches[0].clientX - startX;
        if(Math.abs(delta) > 8) moved = true;
        curX = baseX + delta;
        if(curX > 0) curX = 0;
        if(curX < SWIPE_OPEN_X - 20) curX = SWIPE_OPEN_X - 20;
        card.style.transform = 'translateX('+curX+'px)';
      }, {passive:true});
      card.addEventListener('touchend', function(){
        dragging = false;
        card.style.transition = 'transform 0.22s ease';
        if(curX < SWIPE_OPEN_X/2){
          card.style.transform = 'translateX('+SWIPE_OPEN_X+'px)';
          card.dataset.swipeOpen = '1';
        } else {
          card.style.transform = 'translateX(0px)';
          card.dataset.swipeOpen = '0';
        }
        if(moved) card.dataset.justDragged = '1';
        curX = 0;
      });
    });
  }

  function addManualItem(){
    var input = document.getElementById('manual-item-input');
    if(!input) return;
    var val = input.value.trim();
    if(!val) return;
    state.manualItems.push({id:uid(), name:val, checked:false});
    persist();
    render();
  }

  function handleAction(e){
    var el = e.currentTarget;
    var action = el.getAttribute('data-action');

    if(el.dataset && el.dataset.justDragged==='1'){
      el.dataset.justDragged = '0';
      return;
    }
    if(action==='open-recipe' && el.dataset && el.dataset.swipeOpen==='1'){
      el.style.transform = 'translateX(0px)';
      el.dataset.swipeOpen = '0';
      return;
    }

    if(action==='set-tab'){ setTab(el.getAttribute('data-tab')); return; }
    if(action==='overlay-close'){ closeModal(); return; }
    if(action==='close-modal'){ closeModal(); return; }

    if(action==='open-slot-people'){
      var day = el.getAttribute('data-day'), slot = el.getAttribute('data-slot');
      openModal({type:'slot-people', day:day, slot:slot});
      return;
    }
    if(action==='pick-person'){
      var day = el.getAttribute('data-day'), slot = el.getAttribute('data-slot'), person = el.getAttribute('data-person');
      openModal({type:'pick-recipe', day:day, slot:slot, person:person});
      return;
    }
    if(action==='clear-person'){
      e.stopPropagation();
      var day = el.getAttribute('data-day'), slot = el.getAttribute('data-slot'), person = el.getAttribute('data-person');
      state.week[day][slot][person] = null;
      persist();
      openModal({type:'slot-people', day:day, slot:slot});
      return;
    }
    if(action==='view-person-recipe'){
      e.stopPropagation();
      openModal({type:'recipe-detail', id:el.getAttribute('data-id')});
      return;
    }
    if(action==='toggle-cheat'){
      e.stopPropagation();
      var day = el.getAttribute('data-day');
      state.week[day].cheat = !state.week[day].cheat;
      persist(); render();
      return;
    }
    if(action==='assign-slot'){
      var m = state.modal;
      assignPerson(m.day, m.slot, m.person, el.getAttribute('data-id'));
      persist();
      openModal({type:'slot-people', day:m.day, slot:m.slot});
      return;
    }

    if(action==='new-recipe'){
      state.formDraft = newDraft();
      openModal({type:'recipe-form'});
      return;
    }
    if(action==='open-recipe'){
      openModal({type:'recipe-detail', id:el.getAttribute('data-id')});
      return;
    }
    if(action==='edit-recipe'){
      var r = state.recipes.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
      state.formDraft = draftFromRecipe(r);
      openModal({type:'recipe-form'});
      return;
    }
    if(action==='delete-recipe'){
      var id = el.getAttribute('data-id');
      openModal({type:'confirm-delete', id:id});
      return;
    }
    if(action==='confirm-delete-yes'){
      var id = state.modal.id;
      state.recipes = state.recipes.filter(function(r){return r.id!==id;});
      DAYS.forEach(function(d){
        SLOTS.forEach(function(s){
          var slotVal = state.week[d.key][s.key];
          FAMILY.forEach(function(f){ if(slotVal[f.key]===id) slotVal[f.key]=null; });
        });
      });
      persist();
      closeModal();
      return;
    }
    if(action==='plan-recipe'){
      openModal({type:'plan-recipe', recipeId:el.getAttribute('data-id')});
      return;
    }
    if(action==='pick-plan-slot'){
      var day = el.getAttribute('data-day'), slot = el.getAttribute('data-slot');
      var priorModal = state.modal;
      openModal({type:'plan-recipe-person', day:day, slot:slot, recipeId:priorModal.recipeId});
      return;
    }
    if(action==='assign-person-final'){
      var m = state.modal;
      var person = el.getAttribute('data-person');
      assignPerson(m.day, m.slot, person, m.recipeId);
      persist();
      closeModal();
      return;
    }

    if(action==='pick-tag'){
      syncDraftFromInputs();
      state.formDraft.tag = el.getAttribute('data-tag');
      render();
      return;
    }
    if(action==='add-ing'){
      syncDraftFromInputs();
      state.formDraft.ingredients.push({name:'',qty:'',unit:'g'});
      render();
      return;
    }
    if(action==='remove-ing'){
      syncDraftFromInputs();
      var idx = Number(el.getAttribute('data-idx'));
      state.formDraft.ingredients.splice(idx,1);
      if(state.formDraft.ingredients.length===0) state.formDraft.ingredients.push({name:'',qty:'',unit:'g'});
      render();
      return;
    }
    if(action==='save-recipe'){
      syncDraftFromInputs();
      var d = state.formDraft;
      if(!d.name || !d.name.trim()){ alert('Merci de donner un nom à la recette.'); return; }
      var cleanIngredients = d.ingredients.filter(function(i){return i.name && i.name.trim();})
        .map(function(i){return {name:i.name.trim(), qty: i.qty===''?0:Number(i.qty), unit:i.unit||''};});
      if(d.id){
        var idx = state.recipes.findIndex(function(r){return r.id===d.id;});
        state.recipes[idx] = {id:d.id, name:d.name.trim(), tag:d.tag, ingredients:cleanIngredients, instructions:d.instructions.trim()};
      } else {
        state.recipes.push({id:uid(), name:d.name.trim(), tag:d.tag, ingredients:cleanIngredients, instructions:d.instructions.trim()});
      }
      persist();
      closeModal();
      return;
    }

    if(action==='toggle-auto'){
      var key = el.getAttribute('data-key');
      state.checked[key] = !state.checked[key];
      persist(); render();
      return;
    }
    if(action==='toggle-manual'){
      var id = el.getAttribute('data-id');
      var item = state.manualItems.filter(function(i){return i.id===id;})[0];
      if(item) item.checked = !item.checked;
      persist(); render();
      return;
    }
    if(action==='del-manual'){
      e.stopPropagation();
      var id = el.getAttribute('data-id');
      state.manualItems = state.manualItems.filter(function(i){return i.id!==id;});
      persist(); render();
      return;
    }
    if(action==='add-manual'){
      addManualItem();
      return;
    }
    if(action==='clear-checked'){
      var newChecked = {};
      Object.keys(state.checked).forEach(function(k){ if(!state.checked[k]) newChecked[k]=false; });
      state.checked = newChecked;
      state.manualItems = state.manualItems.filter(function(i){return !i.checked;});
      persist(); render();
      return;
    }
  }

  loadState();
})();
</script>
</body>
</html>
